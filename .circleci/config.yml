version: 2.1

parameters:
  GHA_Actor:
    type: string
    default: ""
  GHA_Action:
    type: string
    default: ""
  GHA_Event:
    type: string
    default: ""
  GHA_Meta:
    type: string
    default: ""

orbs:
  aws-s3: circleci/aws-s3@3.0
  aws-cli: circleci/aws-cli@5.4.1

jobs:
  run-checks:
    docker:
      - image: cimg/python:3.10.18
    resource_class: small

    steps:
      - checkout

      - restore_cache:
          keys:
            - v1.1-deps-{{ checksum "Pipfile.lock" }}

      - run:
          name: Install pipenv and dependencies
          command: |
            pip install pipenv
            pipenv install --dev
            export PIPENV_VERBOSITY=-1

      - save_cache:
          key: v1.1-deps-{{ checksum "Pipfile.lock" }}
          paths:
            - ~/.local/share/virtualenvs

      - run:
          name: Unit tests
          command: |
            pipenv run pytest -vrrP --cov

      - run:
          name: Type checks
          command: |
             pipenv run mypy --follow-untyped-imports utilities

      - run:
          name: Python linting
          command: |
             pipenv run black . --check

      - run:
          name: Docstring linting
          command: |
            pipenv run pydoclint --style=google --quiet .

      - run:
          name: Dependency audit
          command: |
            pipenv run pip-audit -r <(pipenv requirements) 

      - run:
          name: Security check
          command: |
            pipenv run bandit -c bandit.yaml -r utilities
            

  lint-terraform:
    docker:
      - image: docker.mirror.hashicorp.services/hashicorp/terraform:1.2.1
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check terraform formatting
          command: terraform fmt -check -recursive -diff

  terraform-plan:
    parameters:
      aws_account:
        type: enum
        description: The short name of the AWS account, used to reference the relevant `tfbackend` file, and auth credentials
        enum: [ "prod", "dev" ]
      access_key:
        type: env_var_name
      secret_key:
        type: env_var_name
      workspace:
        type: string
        default: "default"
    working_directory: /tmp/project
    docker:
      - image: docker.mirror.hashicorp.services/hashicorp/terraform:1.13.1
    resource_class: small
    steps:
      - checkout
      - run:
          name: terraform plan
          command: |
            export AWS_ACCESS_KEY_ID=${<< parameters.access_key >>}
            export AWS_SECRET_ACCESS_KEY=${<< parameters.secret_key >>}
            cd terraform
            terraform init -input=false -backend-config=../<< parameters.aws_account >>.s3.tfbackend
            terraform workspace select << parameters.workspace >> || terraform workspace new << parameters.workspace >>
            terraform plan -out tfapply
      - store_artifacts:
          path: terraform/tfapply
      - persist_to_workspace:
          root: .
          paths:
            - terraform/tfapply
            - terraform/.*
            - .


  terraform-apply:
    parameters:
      aws_account:
        type: enum
        description: The short name of the AWS account, used to reference the relevant auth credentials
        enum: [ "prod", "dev" ]
      access_key:
        type: env_var_name
      secret_key:
        type: env_var_name
      workspace:
        type: string
        default: "default"
    docker:
      - image: docker.mirror.hashicorp.services/hashicorp/terraform:1.2.1
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - checkout
      - run:
          name: terraform apply
          command: |
            export AWS_ACCESS_KEY_ID=${<< parameters.access_key >>}
            export AWS_SECRET_ACCESS_KEY=${<< parameters.secret_key >>}
            cd terraform
            terraform workspace select << parameters.workspace >>
            terraform apply -auto-approve tfapply

  terraform-destroy:
    working_directory: /tmp/project
    docker:
      - image: docker.mirror.hashicorp.services/hashicorp/terraform:1.13.1
    resource_class: small
    steps:
      - checkout
      - run:
          name: terraform destroy
          command: |
            export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID_dev}"
            export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY_dev}"
            cd terraform
            terraform init -input=false -backend-config=../dev.s3.tfbackend
            export CIRCLE_BRANCH="<< pipeline.parameters.GHA_Meta >>"
            terraform workspace select ${SANITISED_CIRCLE_BRANCH}
            terraform destroy -auto-approve
      - run:
          name: delete workspace
          command: |
            export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID_dev}"
            export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY_dev}"
            cd terraform/pipeline
            terraform workspace select default
            export CIRCLE_BRANCH="<< pipeline.parameters.GHA_Meta >>"
            export SANITISED_CIRCLE_BRANCH=$(echo ${CIRCLE_BRANCH:0:30} | tr -c '[:alnum:]\n' '-' | tr '[:upper:]' '[:lower:]')
            terraform workspace delete ${SANITISED_CIRCLE_BRANCH}


workflows:
  version: 2
  plan-approve-and-deploy-to-main:
    unless: << pipeline.parameters.GHA_Action >>
    jobs:
      - lint-terraform:
          filters:
            branches:
              only: main
      - run-checks:
          requires:
            - lint-terraform
      - terraform-plan:
          access_key: AWS_ACCESS_KEY_ID
          secret_key: AWS_SECRET_ACCESS_KEY
          aws_account: "prod"
          workspace: "prod"
          requires:
            - run-checks
      - plan-approval:
          type: approval
          requires:
            - terraform-plan
      - terraform-apply:
          access_key: AWS_ACCESS_KEY_ID
          secret_key: AWS_SECRET_ACCESS_KEY
          aws_account: "prod"
          workspace: "prod"
          requires:
            - plan-approval

  plan-and-deploy-to-dev:
    unless: << pipeline.parameters.GHA_Action >>
    jobs:
      - lint-terraform:
          filters:
            branches:
              only: dev
      - run-checks:
          requires:
            - lint-terraform
      - terraform-plan:
          access_key: AWS_ACCESS_KEY_ID_dev
          secret_key: AWS_SECRET_ACCESS_KEY_dev
          aws_account: "dev"
          workspace: "default"
          requires:
            - run-checks
      - plan-approval:
          type: approval
          requires:
            - terraform-plan
      - terraform-apply:
          access_key: AWS_ACCESS_KEY_ID_dev
          secret_key: AWS_SECRET_ACCESS_KEY_dev
          aws_account: "dev"
          workspace: "default"
          requires:
            - plan-approval

  plan-and-commit-to-branch:
    unless: << pipeline.parameters.GHA_Action >>
    jobs:
      - lint-terraform:
          filters:
            branches:
              ignore:
                - main
                - dev
      - run-checks:
          requires:
            - lint-terraform
      - terraform-plan:
          access_key: AWS_ACCESS_KEY_ID_dev
          secret_key: AWS_SECRET_ACCESS_KEY_dev
          aws_account: "dev"
          workspace: ${CIRCLE_BRANCH}
          requires:
            - run-checks

  delete-development-environment:
    when: << pipeline.parameters.GHA_Action >>
    jobs:
      - terraform-destroy
